<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House and Garden</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        background: #dfefff;
        font-family: Arial, sans-serif;
      }

      svg {
        background: #dfefff;
      }
    </style>
  </head>
  <body>
    <svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
      <!-- Sky background -->
      <rect x="0" y="0" width="1000" height="1000" fill="#cfe8ff" stroke="#87b6e8" stroke-width="2"/>

      <!-- Sun -->
      <circle cx="820" cy="150" r="60" fill="#ffd966" stroke="#f4b942" stroke-width="5"/>

      <!-- Clouds -->
      <g>
        <ellipse cx="200" cy="180" rx="90" ry="35" fill="#f5f9ff" stroke="#b9d2f4" stroke-width="3"/>
        <ellipse cx="270" cy="170" rx="65" ry="30" fill="#f5f9ff" stroke="#b9d2f4" stroke-width="3"/>
        <ellipse cx="130" cy="170" rx="60" ry="28" fill="#f5f9ff" stroke="#b9d2f4" stroke-width="3"/>
      </g>

      <!-- Grass -->
      <rect x="0" y="700" width="1000" height="300" fill="#8ecf6b" stroke="#5fa14e" stroke-width="4"/>

      <!-- Garden path / curved walkway -->
      <path d="M 510 1000 Q 610 820 700 700 L 760 1000 Z" fill="#d9c28a" stroke="#b38d4d" stroke-width="4"/>

      <!-- House body -->
      <rect x="260" y="420" width="480" height="280" fill="#f8d7a5" stroke="#7a4b2f" stroke-width="6"/>

      <!-- Roof -->
      <polygon points="220,420 500,250 780,420" fill="#a64b35" stroke="#5c2b2b" stroke-width="7"/>

      <!-- Windows -->
      <rect x="315" y="470" width="120" height="100" fill="#bfe9ff" stroke="#3f5a7a" stroke-width="5"/>
      <line x1="375" y1="470" x2="375" y2="570" stroke="#3f5a7a" stroke-width="5"/>
      <line x1="315" y1="520" x2="435" y2="520" stroke="#3f5a7a" stroke-width="5"/>

      <rect x="565" y="470" width="120" height="100" fill="#bfe9ff" stroke="#3f5a7a" stroke-width="5"/>
      <line x1="625" y1="470" x2="625" y2="570" stroke="#3f5a7a" stroke-width="5"/>
      <line x1="565" y1="520" x2="685" y2="520" stroke="#3f5a7a" stroke-width="5"/>

      <!-- Door -->
      <rect x="445" y="540" width="110" height="160" fill="#8b5e3c" stroke="#5b3828" stroke-width="6"/>
      <circle cx="530" cy="620" r="7" fill="#f5d36e" stroke="#8a6a18" stroke-width="2"/>

      <!-- Tree group with transform -->
      <g transform="translate(110 0)">
        <!-- Tree trunk -->
        <rect x="90" y="430" width="40" height="180" fill="#7a4b2d" stroke="#4d2e1b" stroke-width="4"/>
        <!-- Tree leaves -->
        <circle cx="110" cy="380" r="55" fill="#4caf50" stroke="#2e7d32" stroke-width="5"/>
        <circle cx="150" cy="410" r="50" fill="#4caf50" stroke="#2e7d32" stroke-width="5"/>
        <circle cx="70" cy="410" r="48" fill="#4caf50" stroke="#2e7d32" stroke-width="5"/>
      </g>

      <!-- Second small tree -->
      <g transform="translate(710 15)">
        <rect x="90" y="500" width="28" height="120" fill="#7a4b2d" stroke="#4d2e1b" stroke-width="4"/>
        <circle cx="104" cy="470" r="40" fill="#66bb6a" stroke="#2e7d32" stroke-width="4"/>
      </g>

      <!-- Fence line -->
      <line x1="50" y1="760" x2="950" y2="760" stroke="#d3c7aa" stroke-width="5"/>
      <line x1="80" y1="780" x2="930" y2="780" stroke="#d3c7aa" stroke-width="4"/>

      <!-- Garden bush ellipse -->
      <ellipse cx="760" cy="770" rx="120" ry="45" fill="#73b86d" stroke="#448b45" stroke-width="4"/>

      <!-- House label -->
      <text x="470" y="350" font-size="42" font-weight="bold" fill="#3b2d24" text-anchor="middle">House</text>
    </svg>
  </body>
</html>
